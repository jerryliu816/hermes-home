# Test fixture: the same seven cameras as the real deployment.
# See tests/fixtures/home.yaml for why this is a copy rather than a symlink.
# Front Door — real entity IDs, verified against Home Assistant.
#
# THE KEY OF EACH CAMERA IS PERMANENT. Once health history exists it is the join
# key for every recorded interval, so renaming it orphans that camera's entire
# history and presents the new key as never-monitored. Change `name` or add an
# `aliases` entry instead.
#
# health_entity / health_healthy_states (both optional) let health be judged
# from a connectivity sensor's STATE rather than entity availability. See
# config/cameras.example.yaml for when that is needed and how to verify it.
#
# event_image_strategy:
#   image_entity_state  Read image.*, whose STATE is a timestamp of the last
#                       image change. Gives a freshness signal, so we never
#                       analyze the previous event's frame and file it under
#                       the current timestamp.
#   camera_snapshot     No freshness signal — snapshot camera.* directly.
#   none                Metadata-only event; no image fetched or analyzed.
cameras:
  front_door:
    name: Front Door
    camera_entity: camera.front_door
    event_image_entity: image.front_door_event_image
    event_image_strategy: image_entity_state
    trigger_entity: binary_sensor.front_door_person_detected
    location: front_entry
    observes:
      - front_porch
      - front_walkway

  garage_right:
    name: Garage Right
    camera_entity: camera.garage_right
    event_image_entity: image.garage_right_event_image
    event_image_strategy: image_entity_state
    trigger_entity: binary_sensor.garage_right_motion_detected
    location: garage_entry
    # Mounted on the garage's front-facing wall, looking outward at the
    # driveway. It does NOT see inside the garage -- listing `garage` here
    # would make an absence of events there read as an all-clear.
    observes:
      - driveway

  garage_left:
    name: Garage Left
    # The Home Assistant entities keep their original "driveway" names; the
    # camera is mounted on the garage's front wall, left side. Aliases let a
    # question phrased the old way still find it.
    aliases:
      - driveway
      - driveway camera
    camera_entity: camera.driveway
    event_image_entity: image.driveway_event_image
    event_image_strategy: image_entity_state
    trigger_entity: binary_sensor.driveway_motion_detected
    location: garage_entry
    observes:
      - driveway

  left_walkway:
    name: Left Walkway
    # Entities keep their original "left_side_door" names.
    aliases:
      - left side door
      - garage side door
    camera_entity: camera.left_side_door
    event_image_entity: image.left_side_door_event_image
    event_image_strategy: image_entity_state
    trigger_entity: binary_sensor.left_side_door_motion_detected
    location: left_walkway
    observes:
      - garage_side_door

  right_walkway:
    name: Right Walkway
    camera_entity: camera.right_walkway
    event_image_entity: image.right_walkway_event_image
    event_image_strategy: image_entity_state
    trigger_entity: binary_sensor.right_walkway_motion_detected
    location: right_walkway
    observes: []

  backyard:
    name: Backyard
    # On the storage shed, aimed back at the main house. It covers the half of
    # the yard nearest the house plus the two sliding doors -- listed explicitly
    # under both `observes` and `partial_coverage` so a quiet backyard is
    # reported as partly-watched rather than as an all-clear.
    camera_entity: camera.backyard
    event_image_entity: image.backyard_event_image
    event_image_strategy: image_entity_state
    trigger_entity: binary_sensor.backyard_motion_detected
    location: backyard
    observes:
      - backyard
      - rear_entry
    partial_coverage:
      - backyard

  cottage:
    name: Cottage
    # North edge of the shed, facing away from the house toward the cottage.
    # Its own zone rather than `backyard`, so its events stay distinct from the
    # backyard camera's instead of correlating into shared incidents.
    #
    # It also catches the far part of the yard, but between the two shed
    # cameras a portion of the backyard is in neither field of view -- hence
    # partial here too, so the yard never reports as fully covered.
    camera_entity: camera.cottage
    event_image_entity: image.cottage_event_image
    event_image_strategy: image_entity_state
    trigger_entity: binary_sensor.cottage_motion_detected
    location: cottage
    observes:
      - backyard
    partial_coverage:
      - backyard
