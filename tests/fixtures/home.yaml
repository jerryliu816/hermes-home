# Test fixture: a small property used by the whole suite.
#
# Deliberately NOT the operator's real config/home.yaml -- that file is
# gitignored, so tests that read it cannot run on a fresh clone. Keeping a
# fixture here also means the suite's assertions do not shift when someone
# rearranges their actual house.
#
# Two properties the tests depend on:
#   - two cameras, in different zones, so multi-camera behaviour is covered
#   - at least one zone nothing observes (backyard, garage), so the
#     "no coverage" semantics stay tested
home:
  name: Test Home

  zones:
    street:
      name: Street
      kind: exterior
    driveway:
      name: Driveway
      kind: exterior
    front_walkway:
      name: Front Walkway
      kind: exterior
    front_porch:
      name: Front Porch
      kind: exterior
    front_entry:
      name: Front Entry
      kind: threshold
    garage_entry:
      name: Garage Entry
      kind: threshold
    garage:
      name: Garage
      kind: interior
    backyard:
      name: Backyard
      kind: exterior

  relationships:
    - from: street
      to: driveway
      relation: adjacent
    - from: driveway
      to: front_walkway
      relation: adjacent
    - from: front_walkway
      to: front_porch
      relation: leads_to
    - from: front_porch
      to: front_entry
      relation: leads_to
    - from: driveway
      to: garage_entry
      relation: adjacent
    - from: garage_entry
      to: garage
      relation: leads_to
